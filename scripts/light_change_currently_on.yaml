blueprint:
  name: Light - Change currently on
  description: >
    Change lights that are currently on.


    Choose one or multiple lights via a target selector and specify the change you want to make. The script will only change lights that are currently on and not hidden.


    This blueprint is a simple distribution wrapper around a generic script.

    Just press save to create one script you can use on any light target.

    Use the single script created in any automations, input fields allow you to customise it for your automation.
  author: andrew-codechimp
  source_url: https://github.com/andrew-codechimp/HA-Blueprints/blob/main/scripts/light_change_currently_on.yaml
  domain: script

sequence:
  - variables:
      lights_on: >
        {% set ns = namespace(entities=[]) %}

        {% for key in ['entity_id', 'device_id', 'area_id'] %}
          {% set items = light_target.get(key, []) %}
          {% if items is string %}
            {% set items = [items] %}
          {% endif %}

          {% if key == 'entity_id' %}
            {% set found = items %}
          {% elif key == 'device_id' %}
            {% set found = items | map('device_entities') | sum(start=[]) %}
          {% else %}
            {% set found = items | map('area_entities') | sum(start=[]) %}
          {% endif %}

          {% set ns.entities = ns.entities + found %}
        {% endfor %}

        {% set labels = light_target.get('label_id', []) %} {% if labels is
        string %}
          {% set labels = [labels] %}
        {% endif %}

        {% for label in labels %}
          {% set ns.entities = ns.entities + label_entities(label) %}

          {% for device in label_devices(label) %}
            {% set ns.entities = ns.entities + device_entities(device) %}
          {% endfor %}

          {% for area in label_areas(label) %}
            {% set ns.entities = ns.entities + area_entities(area) %}
          {% endfor %}
        {% endfor %}

        {% set result = namespace(lights=[]) %} {% for entity in ns.entities |
        unique %}
          {% if entity.startswith('light.') and is_state(entity, 'on') and not is_hidden_entity(entity) %}
            {% set result.lights = result.lights + [entity] %}
          {% endif %}
        {% endfor %}

        {{ result.lights }}
  - condition: template
    value_template: '{{ lights_on | length > 0 }}'
  - variables:
      light_data: >
        {% set data = {} %}

        {% if color is defined and color is not none %}
          {% set data = dict(data, rgb_color=color) %}
        {% endif %}

        {% if brightness is defined and brightness is not none %}
          {% set data = dict(data, brightness_pct=brightness | int) %}
        {% endif %}

        {% if color_temperature is defined and color_temperature is not none %}
          {% set data = dict(data, color_temp_kelvin=color_temperature | int) %}
        {% endif %}

        {% if brightness_step_pct is defined and brightness_step_pct is not none
        %}
          {% set data = dict(data, brightness_step_pct=brightness_step_pct | int) %}
        {% endif %}              
              
        {{ data }}
  - action: light.turn_on
    target:
      entity_id: '{{ lights_on }}'
    data: '{{ light_data }}'
fields:
  light_target:
    name: Lights
    description: Lights to target.
    required: true
    selector:
      target:
        entity:
          domain: light
  color:
    name: Color
    description: >-
      The color in RGB format. A list of three integers between 0 and 255
      representing the values of red, green, and blue (cannot be used at the same time as color temperature).
    required: false
    selector:
      color_rgb: {}
  color_temperature:
    name: Color temperature
    description: The color temperature in kelvin (cannot be used at the same time as color).
    required: false
    selector:
      color_temp:
        unit: kelvin
        min: 2000
        max: 6500
  brightness:
    name: Brightness
    description: >-
      Number indicating the percentage of full brightness, where 0 turns the
      light off, 1 is the minimum brightness, and 100 is the maximum brightness (cannot be used at the same time as brightness step).
    required: false
    selector:
      number:
        min: 1
        max: 100
        step: 1
        unit_of_measurement: '%'
        mode: slider
  brightness_step_pct:
    name: Brightness step
    description: Change brightness by a percentage (cannot be used at the same time as brightness).
    required: false
    selector:
      number:
        min: -100
        max: 100
        step: 1
        unit_of_measurement: '%'
        mode: slider
icon: mdi:lightbulb-multiple        
mode: queued
max: 10
